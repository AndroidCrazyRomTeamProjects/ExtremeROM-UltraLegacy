name: Build ArtisanROM 7420

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [ZEROLTE, ZEROFLTE, ZENLTE, NOBLELTE]

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Free disk space (1/3)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk space (2/3)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true

    - name: Free disk space (3/3)
      uses: rokibhasansagar/slimhub_actions@main
      with:
        retain: 'compiler_cmake'

    - name: Set up build environment
      run: |
        sudo apt update
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
          jq attr ccache clang ffmpeg golang \
          libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
          libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
          curl xxd patchelf flex bison libarchive-tools build-essential lz4
        sudo modprobe erofs f2fs
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest

    - name: Build dependencies
      run: source ./buildenv.sh ${{ matrix.target }}

    - name: Download source firmware
      run: |
        source ./buildenv.sh ${{ matrix.target }}
        TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/download_fw.sh --force

    - name: Extract source firmware
      run: |
        source ./buildenv.sh ${{ matrix.target }}
        TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/extract_fw.sh --force

    - name: Download target firmware
      run: |
        source ./buildenv.sh ${{ matrix.target }}
        SOURCE_FIRMWARE="$TARGET_FIRMWARE" ./scripts/download_fw.sh --force

    - name: Extract target firmware
      run: |
        source ./buildenv.sh ${{ matrix.target }}
        SOURCE_FIRMWARE="$TARGET_FIRMWARE" ./scripts/extract_7420_fw.sh --force

    - name: Build ROM
      run: |
        source ./buildenv.sh ${{ matrix.target }}
        ./scripts/make_rom.sh --force

    - name: Upload to GoFile
      env:
        GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        GOFILE_FOLDER_ID_ZEROLTE: ${{ secrets.GOFILE_FOLDER_ID_ZEROLTE }}
        GOFILE_FOLDER_ID_ZEROFLTE: ${{ secrets.GOFILE_FOLDER_ID_ZEROFLTE }}
        GOFILE_FOLDER_ID_ZENLTE: ${{ secrets.GOFILE_FOLDER_ID_ZENLTE }}
        GOFILE_FOLDER_ID_NOBLELTE: ${{ secrets.GOFILE_FOLDER_ID_NOBLELTE }}
      run: |
        # 1. Find the TAR file
        TAR_FILE=$(find out -maxdepth 1 -type f -name "ArtisanROM*.tar.md5" | head -n 1)
        if [ -z "$TAR_FILE" ]; then
          echo "❌ No .tar.md5 file found in ./out"
          exit 1
        fi
        echo "✅ Found TAR: $TAR_FILE"

        # 2. Extract and decompress
        mkdir -p out/extracted
        tar -xf "$TAR_FILE" -C out/extracted system.img.lz4 vendor.img.lz4 odm.img.lz4 || true

        cd out/extracted
        if ! ls *.img.lz4 >/dev/null 2>&1; then
          echo "❌ No .img.lz4 files found in TAR"
          exit 1
        fi

        for file in *.img.lz4; do
          echo "📦 Decompressing $file..."
          lz4 -d "$file" "${file%.lz4}"
        done
        cd ../..

        # 3. Choose correct GoFile folder
        case "${{ matrix.target }}" in
          "ZEROLTE")    FOLDER_ID="$GOFILE_FOLDER_ID_ZEROLTE" ;;
          "ZEROFLTE")   FOLDER_ID="$GOFILE_FOLDER_ID_ZEROFLTE" ;;
          "ZENLTE")   FOLDER_ID="$GOFILE_FOLDER_ID_ZENLTE" ;;
          "NOBLELTE")        FOLDER_ID="$GOFILE_FOLDER_ID_NOBLELTE" ;;
          *) echo "❌ Unknown device: ${{ matrix.target }}" && exit 1 ;;
        esac

        # 4. Upload each IMG
        for IMG in out/extracted/*.img; do
          echo "⬆️ Uploading $IMG to GoFile..."
          RESPONSE=$(curl -s -F "file=@$IMG" \
            -F "token=$GOFILE_TOKEN" \
            -F "folderId=$FOLDER_ID" \
            "https://upload.gofile.io/uploadFile")

          LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          echo "✅ Uploaded: $IMG"
          echo "🔗 Download: $LINK"
        done

